version: '3.8'

services:
  backend:
    build: .
    container_name: legal_ai_backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=host.docker.internal
      - QDRANT_PORT=6333
    restart: always
